<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
<rect width="1000" height="190" rx="12" fill="#f5efe3"/>
<rect x="18" y="18" width="964" height="154" rx="8" fill="none" stroke="#b77a45" stroke-width="2"/>
<circle cx="45" cy="45" r="6" fill="#355744"/>
<circle cx="67" cy="45" r="6" fill="#b77a45"/>
<circle cx="89" cy="45" r="6" fill="#3e3a35"/>
<style>
.title{font:700 28px DejaVu Sans,Arial,sans-serif;fill:#2f302d}
.mono{font:18px DejaVu Sans Mono,monospace;fill:#355744}
.sub{font:700 14px DejaVu Sans,Arial,sans-serif;fill:#6b6258;letter-spacing:1px}
.cursor{fill:#b77a45}
</style>
<text x="45" y="93" class="title">POWER ELECTRONICS × CYBERSECURITY</text>
<text x="45" y="126" class="mono">$ ./build_system</text>

<g class="mono">
<text x="45" y="151" opacity="0">Initializing hardware...
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.32;.38" dur="12s" repeatCount="indefinite"/></text>
<text x="45" y="151" opacity="0">Analyzing power stage...
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.40;.60;.66" dur="12s" repeatCount="indefinite"/></text>
<text x="45" y="151" opacity="0">Securing control system...
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.68;.82;.88" dur="12s" repeatCount="indefinite"/></text>
<text x="45" y="151" opacity="0">System ready.
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.90;.98;1" dur="12s" repeatCount="indefinite"/></text>
</g>

<text x="45" y="168" class="sub">HARDWARE · SYSTEMS · SECURITY</text>
<rect x="45" y="132" width="10" height="19" class="cursor">
<animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
</rect>
</svg>